; HCN -> HNC: two different end points (both linear) and a bent saddle.
[system]
name = hcn_isomerization

[geometry]
mode = path
reactant = reactant.xyz
product = product.xyz
saddle_guess = saddle_guess.xyz
targets = reactant, saddle, product

[surrogate]
program = orca
method = B3LYP
basis = cc-pVTZ
neb_images = 9

[subspace]
kind = pca
dim = auto
max_dim = 3

[search]
method = dense-v2
; 0.05 kcal/mol: the saddle of this reaction needs many DMC blocks; the tested run used this value (docs/validation.md, section 4)
eps_total = 0.05

[machine]
profile = example_slurm
