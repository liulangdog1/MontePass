; Water with the optional, experimental last stage: after the geometry search, DMC energies with a trial
; wave function of several determinants from Quantum Package 2 (QP2), at the start geometry and at the
; final geometry (docs/multireference.md; section 9 says why the stage is experimental). The search
; itself is the one of examples/water.
; The machine profile needs the QP2 sections, see machines/example_slurm.ini.
[system]
name = water_multidet

[geometry]
mode = single
geometry = geometry.xyz

[surrogate]
program = orca
method = B3LYP
basis = cc-pVTZ
optimize = yes

[subspace]
kind = modes

[search]
method = dense-v2
eps_total = 0.02

[trial]
kind = multidet
; auto = the package chooses the cutoffs (QP2 setting ci_threshold: a smaller number keeps more
; determinants). It starts with the cutoffs 2.5e-4 and 1e-4 and with hf, the single RHF determinant of QP2.
; It tests each cut against hf, tests whether the energy change of the search (final geometry minus start
; geometry) changes by at most 1.0 kcal/mol between the two cutoffs, with 2 standard errors of margin, adds DMC
; series (2 at the start, at most 4) or the cutoff 5e-5 when the test needs them, and reports a verdict
; (docs/multireference.md, section 10).
; The defaults of the other keys: n_det_max = 100000 (the size of the CIPSI wave function of each geometry),
; auto_cutoffs = 2.5e-4, 1e-4, 5e-5, tolerance = 1.0, series = 2, series_max = 4.
cutoff = auto

[machine]
profile = example_slurm
