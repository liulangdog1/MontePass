; Water with the optional, experimental last stage: after the geometry search, DMC energies with a trial
; wave function of several determinants from Quantum Package 2 (QP2), at the start geometry and at the
; final geometry (docs/multireference.md; section 9 says why the stage is experimental). The search
; itself is the one of examples/water.
; The machine profile needs the QP2 sections, see machines/example_slurm.ini.
[system]
name = water_multidet

[geometry]
mode = single
geometry = geometry.xyz

[surrogate]
program = orca
method = B3LYP
basis = cc-pVTZ
optimize = yes

[subspace]
kind = modes

[search]
method = dense-v2
eps_total = 0.02

[trial]
kind = multidet
; size of the CIPSI wave function of each geometry
n_det_max = 10000
; 1e-3 is the QP2 setting ci_threshold (a smaller number keeps more determinants); hf is the single
; RHF determinant of QP2, for comparison
cutoff = 1e-3, hf
series = 2

[machine]
profile = example_slurm
