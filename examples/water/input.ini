; Water: one geometry, no path. The three internal coordinates are searched.
[system]
name = water

[geometry]
mode = single
geometry = geometry.xyz

[surrogate]
program = orca
method = B3LYP
basis = cc-pVTZ
optimize = yes

[subspace]
kind = modes

[search]
method = dense-v2
; water has 8 valence electrons, so DMC is cheap: a tight tolerance can be afforded
eps_total = 0.02

[machine]
profile = example_slurm
