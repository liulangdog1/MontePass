; Inversion of ammonia: a pyramid, its mirror image, and the planar saddle between them.
[system]
name = ammonia_inversion

[geometry]
mode = path
reactant = reactant.xyz
product = product.xyz
saddle_guess = saddle_guess.xyz
targets = reactant, saddle

[surrogate]
program = orca
method = B3LYP
basis = cc-pVTZ
neb_images = 7

[subspace]
kind = pca
dim = auto

[search]
method = dense-v2
eps_total = 0.02

[machine]
profile = example_slurm
