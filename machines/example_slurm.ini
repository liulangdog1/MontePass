; Example machine profile for a SLURM cluster. Copy it to machines/local/<name>.ini (that folder is
; not tracked by git) and replace every path and module name by those of your cluster.

[machine]
name = example-slurm
scheduler = slurm

; Shell lines run at the start of every job of a kind. A failing line stops the job.
[setup.scf]
lines =
    module load python/3.11
    source /path/to/venv/bin/activate

[setup.qmc]
lines =
    module load openmpi hdf5 boost
    export PATH=/path/to/qmcpack/build/bin:$PATH
    source /path/to/venv/bin/activate

[setup.orca]
lines =
    module load openmpi/4.1.8

[setup.driver]
lines =
    source /path/to/venv/bin/activate

; Quantum Package 2 (QP2). Needed only for the input option [trial] kind = multidet, an experimental stage
; (docs/multireference.md, section 9).
; The first line must be "set +u": the rc file of QP2 reads variables that are not set, and a job script stops
; at such a line without it. Then come the modules that QP2 was built with, and the rc file of QP2. After these
; lines the commands qp_run and qp_create_ezfio must be on the PATH.
[setup.qp2]
lines =
    set +u
    module load intel-oneapi-mkl
    source /path/to/qp2/quantum_package.rc

[executables]
python = python
qmcpack = qmcpack
convert4qmc = convert4qmc
; ORCA must be started by its full path when it runs in parallel
orca = /path/to/orca/bin/orca
; folder of the QMCPACK source tree that holds PyscfToQmcpack.py
pyscf_qmctools = /path/to/qmcpack/src/QMCTools
; The next two keys are needed only for [trial] kind = multidet.
; the file utils/determinants_tools.py of the QMCPACK source tree
determinants_tools = /path/to/qmcpack/utils/determinants_tools.py
; folder of a Python installation that has the package h5py. It is put first on the PATH for the export program
; of QP2 (save_for_qmcpack). Leave the value empty if the Python that [setup.qp2] puts on the PATH has h5py.
qp2_python_bin = /path/to/venv/bin

[launch]
; {ranks}, {nodes} and {ranks_per_node} are filled in by the package.
; "--map-by core --bind-to core" gives every MPI process its own core, also on a node that the job shares
; with other jobs. (The default placement by socket can put two processes on one core there.)
qmc = mpirun -np {ranks} --map-by core --bind-to core

[pseudopotentials]
; folder with one file <Element>.ccECP.xml per element (from https://pseudopotentiallibrary.org)
dir = /path/to/pseudopotentials

; Options common to all jobs
[slurm]
account = myaccount
partition = mypartition

[job.scf]
nodes = 1
tasks = 1
cpus_per_task = 4
mem = 16G
time = 01:00:00

[job.qmc]
nodes = 1
tasks = 32
mem = 32G
time = 04:00:00
; Only for [trial] kind = multidet: time limit of the QMC job of a point with several determinants. Such a job
; needs more time for every step than a job with one determinant. Without this key the value of "time" is used.
time_multidet = 12:00:00

[job.orca]
nodes = 1
tasks = 8
mem = 32G
time = 04:00:00

; Only for [trial] kind = multidet. QP2 is one process with threads: tasks must be 1, and cpus_per_task is the
; number of threads. QP2 plans its memory with 90 % of "mem". If the CIPSI run of a geometry reaches "time", a new
; job continues it (at most 4 jobs for one geometry).
[job.qp2]
nodes = 1
tasks = 1
cpus_per_task = 16
mem = 64G
time = 12:00:00

[job.driver]
nodes = 1
tasks = 1
mem = 4G
time = 48:00:00
